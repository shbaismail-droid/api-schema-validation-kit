<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A fast, accessible to-do list with local storage persistence.">
  <title>Focus Tasks</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <section class="todo-card" aria-labelledby="app-title">
      <header class="app-header">
        <div>
          <p class="eyebrow">PERSONAL ORGANIZER</p>
          <h1 id="app-title">Focus Tasks</h1>
          <p class="subtitle">Keep your day clear and moving.</p>
        </div>
        <button class="icon-button" id="clearCompletedButton" type="button" title="Clear completed tasks" aria-label="Clear completed tasks">⌫</button>
      </header>
      <form class="task-form" id="taskForm">
        <label class="sr-only" for="taskInput">New task</label>
        <input id="taskInput" name="task" type="text" maxlength="120" placeholder="What needs to be done?" autocomplete="off" required>
        <button class="add-button" type="submit">Add task</button>
      </form>
      <div class="toolbar" aria-label="Task filters">
        <span id="taskCount">0 tasks left</span>
        <div class="filters" role="group" aria-label="Show tasks">
          <button class="filter-button active" type="button" data-filter="all">All</button>
          <button class="filter-button" type="button" data-filter="active">Active</button>
          <button class="filter-button" type="button" data-filter="completed">Completed</button>
        </div>
      </div>
      <ul class="task-list" id="taskList" aria-live="polite"></ul>
      <p class="empty-state" id="emptyState">No tasks here yet. Add one to get started.</p>
      <footer class="app-footer"><span>Saved automatically on this device</span><button id="themeButton" class="theme-button" type="button">Dark mode</button></footer>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
