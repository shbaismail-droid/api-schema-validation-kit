<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Generate a random joke from JokeAPI.">
  <title>Laugh Lab</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <section class="joke-card" aria-labelledby="app-title">
      <div class="topline"><span class="badge">DAILY DOSE OF FUN</span><span id="status" role="status" aria-live="polite"></span></div>
      <h1 id="app-title">Laugh Lab <span aria-hidden="true">✦</span></h1>
      <p class="intro">Need a quick laugh? Fetch a fresh, family-friendly joke whenever you need one.</p>

      <div class="joke-panel" id="jokePanel" aria-live="polite" aria-atomic="true">
        <p class="joke-type" id="jokeType">Ready when you are</p>
        <p class="joke-text" id="jokeText">Press the button to generate a random joke.</p>
        <p class="joke-delivery" id="jokeDelivery"></p>
      </div>

      <div class="actions">
        <button class="primary-button" id="newJokeButton" type="button">Tell me a joke <span aria-hidden="true">→</span></button>
        <button class="secondary-button" id="copyButton" type="button" disabled>Copy joke</button>
      </div>
      <p class="error-message" id="errorMessage" hidden>We couldn't fetch a joke. Please try again.</p>
      <p class="source">Powered by <a href="https://jokeapi.dev/" target="_blank" rel="noreferrer">JokeAPI</a> · Safe mode enabled</p>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
